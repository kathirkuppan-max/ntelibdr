<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
#stage{width:1200px;height:1200px;background:#0D1117;font-family:'IBM Plex Sans',sans-serif;color:#F0F6FC;position:relative;padding:90px 96px}
.lab{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.22em;color:#D4A843;font-weight:600}
h1{font-size:76px;font-weight:800;letter-spacing:-.015em;line-height:1.16;margin-top:48px}
h1 i{color:#D4A843;font-style:normal}
.ledger{margin-top:72px;background:#161B22;border:1px solid #2A3446;border-radius:16px;padding:44px 48px}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:30px}
.ledger .n{font-size:30px;color:#9BA8B4;font-weight:500;max-width:640px;line-height:1.4}
.ledger .v{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;color:#F85149;white-space:nowrap}
.ledger .sub{margin-top:26px;padding-top:26px;border-top:1px solid #2A3446;display:flex;justify-content:space-between;align-items:baseline}
.ledger .sub .n{font-size:26px}
.ledger .sub .v{font-size:40px;color:#3FB950}
.foot{position:absolute;left:96px;right:96px;bottom:74px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font-size:34px;font-weight:800}
.brand i{color:#D4A843;font-style:normal}
.note{font-family:'IBM Plex Mono',monospace;font-size:19px;color:#6E7B88;letter-spacing:.04em}
.bar{position:absolute;left:0;bottom:0;height:10px;width:120px;background:#D4A843}
</style></head>
<body>
<div id="stage">
  <div class="lab">THE LEAK LEDGER · 01</div>
  <h1>Your best salesperson's discount isn't a price.<br>It's a <i>habit</i>.</h1>
  <div class="ledger">
    <div class="row">
      <div class="n">Discounting beyond peers on similar deals</div>
      <div class="v">−$538K/yr</div>
    </div>
    <div class="sub">
      <div class="n">Recoverable — by showing the peer band at quote time</div>
      <div class="v">+$392K</div>
    </div>
  </div>
  <div class="foot">
    <div class="brand">nteli<i>.</i>io</div>
    <div class="note">ILLUSTRATIVE MID-MARKET MODEL</div>
  </div>
  <div class="bar"></div>
</div>
</body></html>
