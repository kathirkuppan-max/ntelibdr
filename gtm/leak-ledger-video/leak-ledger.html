<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leak Ledger Film — site slide standard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--bg:#0D1117;--surface:#161B22;--surface2:#1C2333;--border:#2A3446;--border2:#374458;--text:#F0F6FC;--text2:#9BA8B4;--text3:#6E7B88;
--blue:#58A6FF;--gold:#D4A843;--green:#3FB950;--red:#F85149;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05080C;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"IBM Plex Sans",sans-serif;color:var(--text);background:var(--bg)}
.abs{position:absolute}
.mono{font-family:"IBM Plex Mono",monospace}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.lab{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase}
.h1{font-size:84px;font-weight:700;letter-spacing:-.015em;line-height:1.08}
.h1 b{color:var(--gold);font-weight:700}
.sub{font-size:30px;font-weight:500;color:var(--text2)}
.scene{position:absolute;inset:0;opacity:0}
/* chrome */
#brand{left:96px;top:58px;font-size:26px;font-weight:800}
#brand .pl{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;color:var(--gold);letter-spacing:.18em;margin-left:12px;vertical-align:2px}
#sect{right:96px;top:66px;font-family:"IBM Plex Mono",monospace;font-size:19px;letter-spacing:.14em;color:var(--text2)}
#prog{left:0;bottom:0;height:7px;background:var(--gold)}
#note{right:96px;bottom:34px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.1em;color:var(--text3)}
/* counters */
#ctrs{right:96px;top:130px;text-align:right}
#ctrs .one{display:inline-block;margin-left:44px;text-align:right}
#ctrs .v{font-family:"IBM Plex Mono",monospace;font-size:38px;font-weight:600;margin-top:4px}
/* sources */
.src{width:414px;height:112px;padding:18px 22px;position:absolute}
.src .n{font-size:22px;font-weight:600}
.src .k{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-top:7px}
.src .st{position:absolute;right:18px;top:18px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em}
/* ledger */
.col{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.col .ch{position:absolute;left:22px;top:20px;font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.16em}
.col .ct{position:absolute;right:22px;top:20px;font-family:"IBM Plex Mono",monospace;font-size:15px;text-align:right}
.row{position:absolute;width:396px;height:100px;border-radius:10px;background:var(--bg);border:1px solid var(--border);overflow:hidden}
.row .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.row .l{position:absolute;left:18px;top:10px;width:366px;font-size:17.5px;line-height:22px;color:var(--text)}
.row .a{position:absolute;left:18px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600}
.row .a i{position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:var(--text3);transform-origin:left}
.row .r{position:absolute;right:16px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;color:var(--green)}
/* action card */
#tk{position:absolute;left:96px;top:806px;width:1728px;height:128px}
#tk .seg{position:absolute;top:24px}
/* report */
.rp{padding:24px 28px}
.rp .h{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-bottom:14px}
/* cards (open/end) */
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style>
</head>

<script>

  {s:0,l:"Discounting beyond peers on similar deals",leak:538,rec:392,m:1},

const CUT60=/cut=60/.test(location.search);

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

const K=v=>"$"+Math.round(v).toLocaleString("en-US")+"K";
const D=v=>"$"+(Math.round(v)*1000).toLocaleString("en-US");
const world=document.getElementById("world");
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||world).appendChild(e);return e};
const S=(e,o)=>{for(const k in o)e.style[k]=o[k]};
const NS="http://www.w3.org/2000/svg";

// ---------- scene: open ----------
const scOpen=el("div","scene full",world,
 `<div class="h1" style="max-width:1500px">Revenue <b>leaks</b> between the quote and the cash.</div>
  <div class="sub" id="o2" style="margin-top:30px">Here's where, line by line.</div>`);
const o2=scOpen.querySelector("#o2");

// ---------- scene: connect ----------
const scConn=el("div","scene",world);
el("div","h1",scConn,'Connects to what you <b>already run</b>.').style.cssText="position:absolute;left:96px;top:150px";
const SRCX=[96,540,984,1428],SRCY=[338,474];
const srcEls=SOURCES.map((s,i)=>{const e=el("div","card src",scConn,`<div class="n">${s.n}</div><div class="k">${s.k}</div><div class="st"></div>`);
  S(e,{left:SRCX[i%4]+"px",top:SRCY[i<4?0:1]+"px"});return {e,st:e.querySelector(".st")}});
const joinCard=el("div","card",scConn);S(joinCard,{position:"absolute",left:"96px",top:"660px",width:"1728px",height:"150px"});
const joinN=el("div","mono",joinCard,"0");joinN.style.cssText="position:absolute;left:30px;top:34px;font-size:52px;font-weight:600;color:var(--gold)";
el("div","",joinCard,"records joined on one deal ID").style.cssText="position:absolute;left:330px;top:48px;font-size:28px;font-weight:500;color:var(--text2)";
const recStrip=el("div","mono",joinCard,"");recStrip.style.cssText="position:absolute;right:30px;top:52px;font-size:16px;color:var(--text2);letter-spacing:.03em;text-align:right";

// ---------- scene: ledger + levers ----------
const scLed=el("div","scene",world);
const ledH=el("div","h1",scLed,'The <b>Leak Ledger</b>.');ledH.style.cssText="position:absolute;left:96px;top:130px;font-size:62px";
const ledSub=el("div","sub",scLed,"Every dollar itemized, Quote to Comply.");ledSub.style.cssText="position:absolute;left:96px;top:216px;font-size:24px";
const COLX=[96,540,984,1428],COLW=432,COLY=292,ROWY0=66,ROWH=110;
const lineIdx={};LINES.forEach((L,i)=>{(lineIdx[L.s]=lineIdx[L.s]||[]).push(i)});
const rowPos=i=>{const L=LINES[i];const k=lineIdx[L.s].indexOf(i);return {x:COLX[L.s]+18,y:COLY+ROWY0+k*ROWH}};
const cols=STAGES.map((s,i)=>{const c=el("div","col",scLed);S(c,{left:COLX[i]+"px",top:COLY+"px",width:COLW+"px",height:"466px"});
  el("div","ch",c,`<span style="color:var(--text3)">0${i+1}</span>&nbsp; <span style="color:var(--text)">${s.toUpperCase()}</span>`);
  const tot=el("div","ct",c,"");return {c,tot}});
const rows=LINES.map((L,i)=>{const p=rowPos(i);
  const r=el("div","row",scLed,`<div class="bar"></div><div class="l">${L.l}</div><div class="a">${K(L.leak)}<i></i></div><div class="r">+${K(L.rec)}</div>`);
  S(r,{left:p.x+"px",top:p.y+"px"});
  return {r,bar:r.querySelector(".bar"),a:r.querySelector(".a"),st:r.querySelector(".a i"),rc:r.querySelector(".r")}});
// total band
const totBand=el("div","",scLed,`<span class="mono" style="font-size:44px;font-weight:600;color:var(--red)">$2,679,000</span><span style="font-size:26px;color:var(--text2)">&nbsp; leaking this year — now <b style="color:var(--text)">pull the levers</b>.</span>`);
totBand.style.cssText="position:absolute;left:96px;top:836px;";
// action card
const tk=el("div","card",scLed);tk.id="tk";
const tkM=el("div","mono seg",tk);tkM.style.cssText+=";left:28px;width:250px;font-size:15px;letter-spacing:.08em;color:var(--gold);line-height:22px;text-transform:uppercase";
const tkF=el("div","seg",tk);tkF.style.cssText+=";left:306px;top:18px;width:620px";
const tkAr=el("div","mono seg",tk,"→");tkAr.style.cssText+=";left:946px;top:38px;font-size:30px;color:var(--text3)";
const tkA=el("div","seg",tk);tkA.style.cssText+=";left:1006px;top:18px;width:520px";
const tkV=el("div","mono seg",tk);tkV.style.cssText+=";right:28px;top:18px;font-size:34px;font-weight:600;color:var(--green);text-align:right";

// ---------- scene: report ----------
const scRep=el("div","scene",world);
el("div","h1",scRep,'The <b>recovery report</b>.').style.cssText="position:absolute;left:96px;top:118px;font-size:56px";
const repHead=el("div","",scRep,`<span class="mono" style="font-size:38px;font-weight:600;color:var(--green)">$2,139,000</span><span style="font-size:21px;color:var(--text2)"> &nbsp;recovered of $2,679,000 identified</span>`);
repHead.style.cssText="position:absolute;right:96px;top:136px;text-align:right";
const rpA=el("div","card rp",scRep);S(rpA,{position:"absolute",left:"96px",top:"230px",width:"856px",height:"330px"});el("div","h",rpA,"By stage · identified vs recovered");
const STG=[[1236,981],[395,329],[466,385],[582,444]];
const stBars=STG.map((v,i)=>{const y=64+i*62;el("div","abs",rpA,STAGES[i]).style.cssText+=`;left:28px;top:${y+4}px;font-size:19px;width:140px;position:absolute`;
  const bg=el("div","",rpA);S(bg,{position:"absolute",left:"170px",top:y+"px",height:"32px",borderRadius:"6px",background:"#2A1416",width:(v[0]/1236*500)+"px"});
  const fg=el("div","",rpA);S(fg,{position:"absolute",left:"170px",top:y+"px",height:"32px",borderRadius:"6px",background:"var(--green)",width:"0px"});
  const tx=el("div","mono",rpA,`${K(v[1])} <span style="color:var(--text3)">/ ${K(v[0])}</span>`);tx.style.cssText+=`;position:absolute;right:24px;top:${y+5}px;font-size:16px`;return {fg,w:v[1]/1236*500,tx}});
const rpB=el("div","card rp",scRep);S(rpB,{position:"absolute",left:"968px",top:"230px",width:"856px",height:"330px"});el("div","h",rpB,"Recovered, cumulative by quarter");
const chart=document.createElementNS(NS,"svg");chart.setAttribute("width","800");chart.setAttribute("height","248");chart.style.cssText="position:absolute;left:28px;top:58px";rpB.appendChild(chart);
const sv=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const qx=i=>66+i*228, qy=v=>212-v/2139*172;
[0,1,2].forEach(k=>sv("line",{x1:36,x2:786,y1:36+k*88,y2:36+k*88,stroke:"#21293A"},chart));
const qPath=sv("polyline",{points:QTR.map((q,i)=>qx(i)+","+qy(q[1])).join(" "),fill:"none",stroke:"#3FB950","stroke-width":3},chart);
const qLen=QTR.reduce((a,q,i)=>i?a+Math.hypot(qx(i)-qx(i-1),qy(q[1])-qy(QTR[i-1][1])):0,0);qPath.setAttribute("stroke-dasharray",qLen);
const qDots=QTR.map((q,i)=>{const g=sv("g",{},chart);sv("circle",{cx:qx(i),cy:qy(q[1]),r:6,fill:"#3FB950"},g);
  const a=sv("text",{x:qx(i),y:qy(q[1])-16,"text-anchor":"middle","font-family":"IBM Plex Mono","font-size":16,fill:"#F0F6FC"},g);a.textContent=q[1]>=1000?"$"+(q[1]/1000).toFixed(2)+"M":"$"+q[1]+"K";
  const b=sv("text",{x:qx(i),y:242,"text-anchor":"middle","font-family":"IBM Plex Mono","font-size":14,fill:"#6E7B88"},g);return g});
QTR.forEach((q,i)=>{const b=document.createElementNS(NS,"text");b.setAttribute("x",qx(i));b.setAttribute("y",242);b.setAttribute("text-anchor","middle");b.setAttribute("font-family","IBM Plex Mono");b.setAttribute("font-size",14);b.setAttribute("fill","#6E7B88");b.textContent=q[0];chart.appendChild(b)});
const rpC=el("div","card rp",scRep);S(rpC,{position:"absolute",left:"96px",top:"584px",width:"856px",height:"330px"});el("div","h",rpC,"By lever");
const BYM=[589,392,161,168,291,94,211,233];
const mRows=MODS.map((m,i)=>{const y=52+i*31;const r=el("div","",rpC,`<span style="font-size:17px">${m}</span>`);r.style.cssText=`position:absolute;left:28px;top:${y}px;width:800px`;
  const v=el("div","mono",r,"+"+K(BYM[i]));v.style.cssText="position:absolute;right:0;top:0;font-size:17px;color:var(--green)";
  const b=el("div","",r);S(b,{position:"absolute",left:"300px",top:"7px",height:"10px",borderRadius:"5px",background:"#1B4D22",width:(BYM[i]/589*380)+"px"});return r});
const rpD=el("div","card rp",scRep);S(rpD,{position:"absolute",left:"968px",top:"584px",width:"856px",height:"330px"});el("div","h",rpD,"Trace one line · D-24817");
const TR=[["Quote","Q-24817-3","adder added: seismic bracing"],["Order","SO-88412","built from the accepted quote"],["Invoice","INV-310977","matches contract price"],["Rebate","RC-5521","tier paid on shipped units"]];
const trEls=TR.map((x,i)=>{const e=el("div","",rpD,`<div class="lab" style="color:var(--gold)">${x[0]}</div><div class="mono" style="font-size:19px;margin-top:6px">${x[1]}</div><div style="font-size:14.5px;color:var(--text2);margin-top:6px;line-height:19px">${x[2]}</div>`);
  e.style.cssText=`position:absolute;left:${28+i*202}px;top:72px;width:180px`;return e});
const trLine=el("div","",rpD);S(trLine,{position:"absolute",left:"28px",top:"62px",height:"2px",background:"var(--gold)",width:"0px"});
const trFoot=el("div","",rpD,`<span style="color:var(--green)" class="mono">+$3,140</span> recovered on this deal &nbsp;·&nbsp; <span style="color:var(--text2)">every line traceable to a deal ID</span>`);trFoot.style.cssText="position:absolute;left:28px;top:252px;font-size:19px";

// ---------- scene: end ----------
const scEnd=el("div","scene full",world,
 `<div class="mono" style="color:var(--gold);letter-spacing:.3em;font-size:22px;font-weight:600">NTELI</div>
  <div class="h1" style="margin-top:26px">Agentic <b>revenue orchestration</b>.</div>
  <div class="mono" style="margin-top:30px;font-size:23px;color:var(--text2);letter-spacing:.08em">QUOTE &rarr; ORDER &rarr; RECOGNIZE &rarr; COMPLY</div>
  <div style="margin-top:44px;font-size:26px;color:var(--text2)">See your own Leak Ledger &nbsp;·&nbsp; <span style="color:var(--gold)">nteli.io</span></div>`);

// ---------- chrome refs ----------
const sect=document.getElementById("sect"),prog=document.getElementById("prog"),note=document.getElementById("note"),
      brand=document.getElementById("brand"),ctrs=document.getElementById("ctrs"),
      cLeak=document.getElementById("cLeak"),cRec=document.getElementById("cRec");

// ---------- render ----------
function render(t){
  // chrome
  prog.style.width=(t/T.DUR*1920)+"px";
  const chromeOn=Math.min(seg(t,T.open[1]-.6,T.open[1]+.3),1-seg(t,T.end[0],T.end[0]+.6));
  brand.style.opacity=Math.max(chromeOn,0);
  let label="";
  if(t<T.morph[0]) label="01 · CONNECT";
  else if(t<T.pull[0]) label="02 · THE LEAK LEDGER";
  else if(t<T.report[0]+1) label="03 · THE LEVERS";
  else label="04 · THE RECOVERY REPORT";
  sect.textContent=label;sect.style.opacity=chromeOn;
  note.style.opacity=chromeOn*(t>T.connect[1]-2?1:0);
  // counters (visible in ledger/levers/report)
  let leakSum=0,recSum=0;LINES.forEach((L,i)=>{leakSum+=L.leak*eo(seg(t,tLeak(i),tLeak(i)+1.1));recSum+=L.rec*eo(seg(t,tClose(i)+.9,tClose(i)+2.2))});
  cLeak.textContent=D(leakSum-recSum);cRec.textContent=D(recSum);
  ctrs.style.opacity=Math.min(seg(t,T.leakStart,T.leakStart+1),1-seg(t,T.report[0],T.report[0]+.8));

  // open
  const oIn=seg(t,.2,1),oOut=seg(t,T.open[1]-.7,T.open[1]);scOpen.style.opacity=Math.min(oIn,1-oOut);
  scOpen.firstElementChild.style.transform=`translateY(${(1-eo(oIn))*16}px)`;
  o2.style.opacity=seg(t,T.open[0]+(CUT60?1.3:1.6),T.open[0]+(CUT60?2:2.4));

  // connect
  const cv=Math.min(seg(t,T.connect[0],T.connect[0]+.8),1-seg(t,T.morph[0],T.morph[0]+1));scConn.style.opacity=cv;
  scConn.style.transform=`translateY(${(1-eo(seg(t,T.connect[0],T.connect[0]+.8)))*18}px)`;
  let joined=0;
  srcEls.forEach((s,i)=>{const t0=T.src0+i*T.srcStep,on=seg(t,t0,t0+.6);
