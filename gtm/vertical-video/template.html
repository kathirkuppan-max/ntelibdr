<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nteli vertical demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0E1319;--card:#151B23;--card2:#19202A;--bd:#28313D;--bd2:#353F4D;--tx:#ECF0F4;--tx2:#A3AEBA;--tx3:#6B7785;--gold:#D4A843;--teal:#2DD4BF;--red:#F0605D;
--sans:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--tx);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;opacity:0}
.hdr{position:absolute;left:96px;right:96px;top:72px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font-weight:700;font-size:30px;letter-spacing:-.3px}
.brand span{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--gold);margin-left:10px;letter-spacing:.04em}
.lbl{font-family:var(--mono);font-size:18px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.prog{position:absolute;left:0;bottom:0;height:5px;background:var(--gold)}
.progbg{position:absolute;left:0;right:0;bottom:0;height:5px;background:#1A212B}
.a{opacity:0;transform:translateY(18px)}
h1.hook{position:absolute;left:96px;top:250px;font-size:104px;font-weight:700;line-height:1.2;letter-spacing:-2.5px;max-width:1300px}
.g{color:var(--gold)}.t{color:var(--teal)}
.sub{font-size:38px;color:var(--tx2);line-height:1.45}
h2{font-size:66px;font-weight:700;letter-spacing:-1.4px;line-height:1.15}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px}
.num{font-family:var(--mono);font-size:24px;color:var(--gold);font-weight:600}
/* scene 1 */
.today{position:absolute;left:96px;right:96px;top:210px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:150px}
.three .card{padding:44px 44px 52px;min-height:400px}
.three h3{font-size:42px;font-weight:600;margin:28px 0 30px;line-height:1.2}
.three p{font-size:32px;color:var(--tx2);line-height:1.45}
/* scene 2 */
.meet{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.meet .logo{font-size:150px;font-weight:700;letter-spacing:-4px}
.meet .tag{font-size:48px;line-height:1.4;margin-top:56px}
.meet .chk{font-size:36px;color:var(--teal);margin-top:40px}
/* scene 3 */
.conv{position:absolute;left:96px;top:240px;width:640px}
.steps{margin-top:110px}
.step{display:flex;align-items:center;gap:28px;font-size:36px;white-space:nowrap;margin-bottom:62px;color:var(--tx3)}
.step i{flex:0 0 54px;height:54px;border-radius:50%;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:600;color:var(--tx3)}
.step.on{color:var(--tx)}.step.on i{background:var(--gold);border-color:var(--gold);color:#111}
.chat{position:absolute;left:760px;right:96px;top:230px;bottom:90px;padding:0}
.chat .bar{display:flex;justify-content:space-between;align-items:center;padding:26px 36px;border-bottom:2px solid var(--bd);font-size:30px;font-weight:600}
.chat .bar span{font-family:var(--mono);font-size:19px;color:var(--teal);font-weight:500}
.msgs{position:absolute;left:36px;right:36px;bottom:36px;top:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:26px;overflow:hidden}
.m{max-width:78%;padding:22px 28px;border-radius:12px;font-size:28px;line-height:1.45}
.m.u{align-self:flex-end;background:var(--card2);border:2px solid var(--bd2)}
.m.u small{display:block;font-family:var(--mono);font-size:17px;color:var(--tx3);letter-spacing:.06em;margin-bottom:8px}
.m.b{align-self:flex-start;background:transparent;border:2px solid var(--bd);color:var(--tx)}
.qr{border:2px solid var(--bd2);border-radius:12px;padding:26px 30px;background:#121820}
.qr .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.qr .k{font-family:var(--mono);font-size:19px;color:var(--teal);font-weight:600;letter-spacing:.06em}
.qr .s{font-size:22px;color:var(--tx3);margin-top:6px}
.qr .tot{font-size:56px;font-weight:700;color:var(--gold)}
.ln{display:flex;justify-content:space-between;font-size:26px;padding:12px 0;border-top:1px solid var(--bd)}
.ln b{font-weight:600}
/* scene 4 */
.trust{position:absolute;left:96px;right:96px;top:200px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:80px}
.two .card{padding:46px 46px 40px}
.two h3{font-size:40px;font-weight:600;margin-bottom:34px}
.two li{list-style:none;font-size:33px;line-height:1.35;margin-bottom:30px;display:flex;gap:22px;color:var(--tx2)}
.two li:before{font-weight:700;flex:0 0 26px}
.gen h3{color:var(--tx2)}.gen li:before{content:'×';color:var(--red)}
.nte{border-color:var(--gold)!important}.nte li{color:var(--tx)}.nte li:before{content:'✓';color:var(--gold)}
/* scene 5 */
.std{position:absolute;left:96px;top:190px;width:720px}
.std p{font-size:33px;color:var(--tx2);line-height:1.5;margin-top:70px}
.stdp{position:absolute;left:880px;right:96px;top:180px;padding:40px 44px}
.stdp .h{font-family:var(--mono);font-size:21px;color:var(--gold);font-weight:600;letter-spacing:.06em;margin:28px 0 14px}
.stdp .h:first-child{margin-top:0}
.stdp .r{font-size:30px;line-height:1.35;margin-bottom:14px;display:flex;gap:20px}
.stdp .r:before{content:'✓';color:var(--teal);flex:0 0 24px;font-weight:700}
.stdp .r.s:before{content:'•';color:var(--tx3)}
.stdp .x{margin-top:30px;border:2px solid var(--red);border-radius:10px;padding:20px 26px;font-size:27px;display:flex;gap:18px}
.stdp .x:before{content:'✗';color:var(--red);font-weight:700}
/* scene 6 */
.gov{position:absolute;left:96px;right:96px;top:200px}
.illu{text-align:right;font-family:var(--mono);font-size:17px;color:var(--tx3);letter-spacing:.08em;margin-top:40px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:20px}
.tile{padding:38px 40px}
.tile .v{font-size:72px;font-weight:700;letter-spacing:-1.5px}
.tile .d{font-size:28px;color:var(--tx2);margin-top:22px}
.sign{margin-top:60px;font-size:32px;font-weight:600}
.sign div{font-size:29px;color:var(--tx2);font-weight:400;margin-top:16px}
/* scene 7 */
.lock{position:absolute;left:250px;top:390px}
.keep{position:absolute;left:700px;top:330px;right:120px}
.keep h2{font-size:62px}
.keep li{list-style:none;font-size:34px;margin-top:40px;display:flex;gap:24px;align-items:center}
.keep li:before{content:'';width:14px;height:14px;border-radius:50%;background:var(--teal);flex:0 0 14px}
/* scene 8 */
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:44px;margin-top:130px}
.week{padding:40px 38px 46px;min-height:380px;position:relative}
.week .w{font-family:var(--mono);font-size:21px;color:var(--gold);font-weight:600;letter-spacing:.06em}
.week h3{font-size:40px;font-weight:600;margin:28px 0 30px;line-height:1.2}
.week p{font-size:29px;color:var(--tx2);line-height:1.45}
.week.last{border-color:var(--gold)}
/* scene 9 */
.end .logo{font-size:120px}
.end .tag{font-size:50px;margin-top:40px}
.end .tag2{font-size:36px;color:var(--tx2);margin-top:26px}
.end .url{font-family:var(--mono);font-size:34px;color:var(--teal);margin-top:70px}
</style>
</head>
<body>
<div id="root"></div>
<div class="progbg"></div><div class="prog" id="prog"></div>
<script>
const name=(new URLSearchParams(location.search)).get('cfg');
document.write('<script src="out/'+name+'.cfg.js"><\/script>');
</script>
<script>
const C=window.CFG, S=C.scenes, root=document.getElementById('root');
const esc=s=>s;
function hdr(lbl){return `<div class="hdr"><div class="brand">nteli<span>QUOTING</span></div><div class="lbl">${lbl}</div></div>`}
const L=['', '01 · Today','02 · Meet','03 · How it works','04 · Why it can be trusted','05 · Standards checked','06 · Governed quoting','07 · Your knowledge stays yours','08 · Live in one month',''];
const html=[];
// 0 hook
html.push(hdr(C.vertical_label)+`<h1 class="hook a" data-t="0.2">${C.hook}</h1><div class="sub a" data-t="${S[0].sub_at}" style="position:absolute;left:96px;top:${C.hook_sub_top||690}px;max-width:1500px">${C.hook_sub}</div>`);
// 1 today
html.push(hdr(L[1])+`<div class="today"><h2 class="a" data-t="0.2">${C.today_title}</h2><div class="three">${C.today.map((c,i)=>`<div class="card a" data-t="${0.9+i*0.5}"><div class="num">0${i+1}</div><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div></div>`);
// 2 meet
html.push(hdr(L[2])+`<div class="meet"><div class="logo a" data-t="0.2">nteli <span class="g">Quoting</span></div><div class="tag a" data-t="1.0">${C.meet_tag}</div><div class="chk a" data-t="${S[2].sub_at}">${C.meet_check}</div></div>`);
// 3 conversation
const q=C.chat;
html.push(hdr(L[3])+`<div class="conv"><h2 class="a" data-t="0.2" style="font-size:62px">One conversation.<br><span class="g">No forms.</span></h2><div class="steps">${['Paste the customer’s '+C.request_word,'Answer one question','Get a checked quote','Submit'].map((s,i)=>`<div class="step" data-on="${S[3].step_at[i]}"><i>${i+1}</i>${s}</div>`).join('')}</div></div>
<div class="chat card a" data-t="0.4"><div class="bar">Quote assistant<span>rules engine connected</span></div><div class="msgs">
<div class="m u a" data-t="${S[3].step_at[0]}"><small>${q.from}</small>${q.request}</div>
<div class="m b a" data-t="${S[3].step_at[1]}">${q.question}</div>
<div class="m u a" data-t="${S[3].step_at[1]+1.6}" style="max-width:60%">${q.answer}</div>
<div class="qr a" data-t="${S[3].step_at[2]}"><div class="top"><div><div class="k">QUOTE READY</div><div class="s">${q.quote_sub}</div></div><div class="tot">${q.total}</div></div>${q.lines.map((l,i)=>`<div class="ln a" data-t="${S[3].step_at[2]+0.5+i*0.35}"><span>${l[0]}</span><b>${l[1]}</b></div>`).join('')}</div>
</div></div>`);
// 4 trust
html.push(hdr(L[4])+`<div class="trust"><h2 class="a" data-t="0.2">It doesn’t guess. It checks.</h2><div class="two">
<div class="card gen a" data-t="0.9"><h3>Generic AI chat</h3><ul>${['Predicts a plausible-sounding answer','Can invent a part number or a rating','May answer differently next time','Can’t show why an option was ruled out'].map((s,i)=>`<li class="a" data-t="${1.2+i*0.35}">${s}</li>`).join('')}</ul></div>
<div class="card nte a" data-t="${S[4].sub_at}"><h3>Nteli Quoting</h3><ul>${['Checks every choice against your product rules','Quotes only parts that exist in your catalog','Same request, same answer, every time','Explains every “why not” in plain words'].map((s,i)=>`<li class="a" data-t="${S[4].sub_at+0.3+i*0.45}">${s}</li>`).join('')}</ul></div></div></div>`);
// 5 standards
let stdRows='',k=0;
C.standards.forEach(g=>{stdRows+=`<div class="h a" data-t="${1.0+k*0.3}">${g[0]}</div>`;k++;g[1].forEach(r=>{stdRows+=`<div class="r ${g[2]?'s':''} a" data-t="${1.0+k*0.3}">${r}</div>`;k++;})});
html.push(hdr(L[5])+`<div class="std"><h2 class="a" data-t="0.2" style="font-size:60px">Every quote shows<br><span class="g">the standards<br>behind it.</span></h2><p class="a" data-t="0.8">${C.standards_text}</p></div><div class="stdp card a" data-t="0.6">${stdRows}<div class="x a" data-t="${S[5].sub_at}">${C.refusal}</div></div>`);
// 6 governed
const T=[['148','quotes this month',''],['71%','approved with no sign-off needed','t'],['4.2 h','median time to sign-off',''],['$18,400','discounts beyond the usual range','g'],['2','unverified rules still in use','g'],['✓ intact','tamper-evident audit trail','t']];
html.push(hdr(L[6])+`<div class="gov"><h2 class="a" data-t="0.2">${C.gov_title}</h2><div class="illu a" data-t="0.6">ILLUSTRATIVE DATA</div><div class="tiles">${T.map((x,i)=>`<div class="card tile a" data-t="${0.9+i*0.3}"><div class="v ${x[2]}">${x[0]}</div><div class="d">${x[1]}</div></div>`).join('')}</div><div class="sign a" data-t="${S[6].sub_at}">Sign-offs follow your rules:<div>discounts → sales manager &nbsp;·&nbsp; unverified rules or unmet standards → engineering &nbsp;·&nbsp; specials → Specials team</div></div></div>`);
// 7 keep
html.push(hdr(L[7])+`<svg class="lock a" data-t="0.3" width="300" height="360" viewBox="0 0 100 120"><path d="M25 50V35a25 25 0 0 1 50 0v15" fill="none" stroke="#D4A843" stroke-width="10"/><rect x="10" y="50" width="80" height="66" rx="10" fill="#D4A843"/><circle cx="50" cy="80" r="8" fill="#0E1319"/><rect x="46" y="82" width="8" height="18" rx="3" fill="#0E1319"/></svg>
<div class="keep"><h2 class="a" data-t="0.4">${C.keep_who} get answers.<br><span class="g">Never the rulebook.</span></h2><ul><li class="a" data-t="${S[7].sub_at}">The rules stay on your server, not on anyone’s laptop</li><li class="a" data-t="${S[7].sub_at+0.8}">Everyone signs in with their own key, revocable any time</li></ul></div>`);
// 8 weeks
const W=[['Fill in the workbook','Questions, parts, vendor costs, rules, pricing.'],['The engine checks it','Contradictions, dead options, unpriced parts.'],['Replay past quotes','Every mismatch becomes a question for engineering.'],['Go live',C.golive]];
html.push(hdr(L[8])+`<div class="today"><h2 class="a" data-t="0.2">Live in one month.</h2><div class="weeks">${W.map((w,i)=>`<div class="card week ${i==3?'last':''} a" data-t="${S[8].week_at[i]}"><div class="w">WEEK ${i+1}</div><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('')}</div></div>`);
// 9 end
html.push(hdr('')+`<div class="meet end"><div class="logo a" data-t="0.2">nteli <span class="g">Quoting</span></div><div class="tag a" data-t="0.8">${C.end_tag}</div><div class="tag2 a" data-t="1.3">${C.meet_tag.replace('<br>',' ')}</div><div class="url a" data-t="1.8">${C.url}</div></div>`);
root.innerHTML=html.map((h,i)=>`<div class="scene" id="s${i}">${h}</div>`).join('');
let acc=0; S.forEach(s=>{s.start=acc; acc+=s.dur}); window.DUR=acc;
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
window.seek=function(t){
  S.forEach((s,i)=>{const el=document.getElementById('s'+i), lt=t-s.start;
    let o=0; if(lt>=0&&lt<s.dur){o=Math.min(1,lt/0.35); if(i<S.length-1) o=Math.min(o,(s.dur-lt)/0.35);} else if(i==S.length-1&&lt>=s.dur) o=1;
    el.style.opacity=Math.max(0,o); el.style.display=o>0?'block':'none';
    if(o>0){el.querySelectorAll('[data-t]').forEach(a=>{const p=ease((lt-parseFloat(a.dataset.t))/0.55);a.style.opacity=p;a.style.transform=`translateY(${(1-p)*18}px)`});
      el.querySelectorAll('[data-on]').forEach(a=>a.classList.toggle('on',lt>=parseFloat(a.dataset.on)));}
  });
  document.getElementById('prog').style.width=(100*Math.min(1,t/window.DUR))+'%';
};
window.seek(0);
</script>
</body>
</html>
